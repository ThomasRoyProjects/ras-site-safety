<text class="noteh" x="1124" y="940">Rules</text>
<text class="note" x="1124" y="968">• One submission per worker, site, and date: UNIQUE (worker_id, site_id, work_date).</text>
<text class="note" x="1124" y="994">• Each submission has 1–5 photos. Originals are split into chunks of at most 1 MiB.</text>
<text class="note" x="1124" y="1020">• Deleting a photo cascades to its photo_chunks and photo_thumbnails rows.</text>
<text class="note" x="1124" y="1046">• upload_staging_chunks holds an upload only until it commits or fails.</text>
<text class="note" x="1124" y="1072">• app_metadata stores the bootstrap marker and schema_version = 3.</text>
<text class="noteh" x="1124" y="1110">Indexes</text>
<text class="note" x="1124" y="1138">• photos_submission_id_idx · sessions_user_id_idx · sessions_expires_at_idx</text>
</svg>
